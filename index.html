<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TriMet GTFS Data Visualization - Bret Bernhoft</title>
    <link
      rel="icon"
      href="https://hosting.photobucket.com/bbcfb0d4-be20-44a0-94dc-65bff8947cf2/ff4a3384-baa9-4bc2-94c9-6bff4e3d3ea0.png"
      sizes="any"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="map"></div>

    <div class="control">
      <div class="panel-head">
        <h1>TriMet Network Activity</h1>
      </div>

      <div class="clock-row">
        <button id="playpause" class="play-btn" aria-label="Play">
          <svg
            class="ic-play"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <path d="M4.5 2.5v11l9-5.5z" fill="currentColor" />
          </svg>
          <svg
            class="ic-pause"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor" />
          </svg>
        </button>
        <output id="timeLabel">09:00:00</output>
      </div>

      <div class="slider-block">
        <input
          id="time"
          type="range"
          min="32400"
          max="64799"
          value="32400"
          aria-label="Simulation time"
        />
        <div class="slider-ends">
          <span id="windowStart">09:00</span>
          <span id="windowEnd">17:59</span>
        </div>
      </div>

      <div class="settings">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="60" selected>x60</option>
          <option value="120">x120</option>
          <option value="300">x300</option>
          <option value="600">x600</option>
          <option value="1200">x1200</option>
        </select>

        <label for="trailSeconds">Trails</label>
        <select id="trailSeconds">
          <option value="0" selected>Off</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
          <option value="1800">30 min</option>
        </select>
      </div>

      <div class="activity">
        <div class="stat-hero">
          <div class="stat-label">Active vehicles</div>
          <div class="stat-value" id="statActive">0</div>
        </div>

        <div class="stat-row">
          <div class="stat">
            <div class="stat-label">Trips this hour</div>
            <div class="stat-value-sm" id="statTripsHour">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Percent active</div>
            <div class="stat-value-sm" id="statPercent">0%</div>
          </div>
          <div class="stat">
            <div class="stat-label">Hour window</div>
            <div class="stat-value-sm" id="statHourWindow">09:00-09:59</div>
          </div>
        </div>

        <div class="routes-head">
          <h4>Busiest routes</h4>
          <button id="clearSpotlight" hidden>✕ Clear</button>
        </div>
        <div class="routes-live" id="statRoutesLive"></div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="main.js"></script>
  </body>
</html>
